name: build

# Full CI: builds the SymCrypt dependency, the SysmonUser service and the
# SysmonDrv kernel driver, then runs the runnable test suites (hash vectors,
# rules-match vectors) and the source-level static regression guards.
#
# NOTE: the driver job provisions the WDK from the Microsoft.Windows.WDK.x64
# NuGet package and passes it to SysmonDrv/build.ps1 -WdkRoot. The pinned WDK
# NuGet version may need bumping as new versions ship; the job prints the
# extracted package layout to make a layout mismatch easy to diagnose.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional tag to create a GitHub Release (for example v0.1.0)'
        required: false
        type: string

jobs:
  build-user:
    name: SysmonUser + tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: microsoft/setup-msbuild@v2

      - name: Restore WDK NuGet package for SymCrypt headers
        shell: pwsh
        run: |
          nuget install Microsoft.Windows.WDK.x64 -Version 10.0.26100.3323 -OutputDirectory "$env:RUNNER_TEMP/wdk"
          $pkg = Get-ChildItem "$env:RUNNER_TEMP/wdk" -Directory | Select-Object -First 1
          if (-not $pkg) { throw 'WDK NuGet package not restored' }
          "WDK_CONTENT_ROOT=$($pkg.FullName)\c" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build SymCrypt
        shell: pwsh
        run: |
          $symCryptRoot = (Resolve-Path 'third_party/SymCrypt').Path + '\\'
          $wdkIncludeRoot = Join-Path $env:WDK_CONTENT_ROOT 'Include\10.0.26100.0'
          $env:CL = '/I"' + (Join-Path $wdkIncludeRoot 'km') + '" /I"' + (Join-Path $wdkIncludeRoot 'shared') + '" /I"' + (Join-Path $wdkIncludeRoot 'ucrt') + '"'
          $env:INCLUDE = (Join-Path $wdkIncludeRoot 'km') + ';' + (Join-Path $wdkIncludeRoot 'shared') + ';' + (Join-Path $wdkIncludeRoot 'ucrt')
          $includePath = @((Join-Path $wdkIncludeRoot 'km'), (Join-Path $wdkIncludeRoot 'shared'), (Join-Path $wdkIncludeRoot 'ucrt'), (Join-Path $symCryptRoot 'inc')) -join '%3B'
          msbuild (Join-Path $symCryptRoot 'lib\\symcrypt_static.vcxproj') "/p:SolutionDir=$symCryptRoot" "/p:WindowsSdkDir=$($env:WDK_CONTENT_ROOT)\\" "/p:IncludePath=$includePath" /p:TargetPlatformVersion=10.0.26100.0 /p:WindowsSDKInstalled=true /p:WindowsSDK_Desktop_Support=true /p:Configuration=Release /p:Platform=x64 /p:SpectreMitigation=false /p:Driver_SpectreMitigation=false /m

      - name: Stage SymCrypt static lib where the projects expect it
        shell: pwsh
        run: |
          $lib = 'third_party/SymCrypt/build/bin/amd64fre/lib/symcrypt_static.lib'
          if (-not (Test-Path -LiteralPath $lib -PathType Leaf)) { throw "symcrypt_static.lib not found at $lib" }

      - name: Build SysmonUser (Release x64)
        run: msbuild SysmonUser\SysmonUser.vcxproj /p:Configuration=Release /p:Platform=x64 /m

      - name: Run hash-compat vector tests
        shell: pwsh
        run: pwsh -File SysmonUser/tests/Invoke-HashCompatVectorTest.ps1

      - name: Run rules-match vector tests
        shell: pwsh
        run: pwsh -File SysmonUser/tests/Invoke-RulesMatchVectorTest.ps1

      - name: Run static regression guards
        shell: pwsh
        run: pwsh -File scripts/Test-StaticRegressionGuards.ps1

      - name: Upload user-mode Release binary
        uses: actions/upload-artifact@v4
        with:
          name: opensysmon-user-release
          path: SysmonUser/x64/Release/Sysmon.exe
          if-no-files-found: error

  build-driver:
    name: SysmonDrv (driver)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: microsoft/setup-msbuild@v2

      - name: Restore WDK NuGet package for SymCrypt headers
        shell: pwsh
        run: |
          nuget install Microsoft.Windows.WDK.x64 -Version 10.0.26100.3323 -OutputDirectory "$env:RUNNER_TEMP/wdk"
          $pkg = Get-ChildItem "$env:RUNNER_TEMP/wdk" -Directory | Select-Object -First 1
          if (-not $pkg) { throw 'WDK NuGet package not restored' }
          "WDK_ROOT=$($pkg.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WDK_CONTENT_ROOT=$($pkg.FullName)\c" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build SymCrypt
        shell: pwsh
        run: |
          $symCryptRoot = (Resolve-Path 'third_party/SymCrypt').Path + '\\'
          $wdkIncludeRoot = Join-Path $env:WDK_CONTENT_ROOT 'Include\10.0.26100.0'
          $env:CL = '/I"' + (Join-Path $wdkIncludeRoot 'km') + '" /I"' + (Join-Path $wdkIncludeRoot 'shared') + '" /I"' + (Join-Path $wdkIncludeRoot 'ucrt') + '"'
          $env:INCLUDE = (Join-Path $wdkIncludeRoot 'km') + ';' + (Join-Path $wdkIncludeRoot 'shared') + ';' + (Join-Path $wdkIncludeRoot 'ucrt')
          $includePath = @((Join-Path $wdkIncludeRoot 'km'), (Join-Path $wdkIncludeRoot 'shared'), (Join-Path $wdkIncludeRoot 'ucrt'), (Join-Path $symCryptRoot 'inc')) -join '%3B'
          msbuild (Join-Path $symCryptRoot 'lib\\symcrypt_static.vcxproj') "/p:SolutionDir=$symCryptRoot" "/p:WindowsSdkDir=$($env:WDK_CONTENT_ROOT)\\" "/p:IncludePath=$includePath" /p:TargetPlatformVersion=10.0.26100.0 /p:WindowsSDKInstalled=true /p:WindowsSDK_Desktop_Support=true /p:Configuration=Release /p:Platform=x64 /p:SpectreMitigation=false /p:Driver_SpectreMitigation=false /m

      - name: Stage SymCrypt static lib where the driver expects it
        shell: pwsh
        run: |
          $lib = 'third_party/SymCrypt/build/bin/amd64fre/lib/symcrypt_static.lib'
          if (-not (Test-Path -LiteralPath $lib -PathType Leaf)) { throw "symcrypt_static.lib not found at $lib" }

      - name: Build SysmonDrv (Release)
        shell: pwsh
        run: |
          Push-Location SysmonDrv
          pwsh -File ./build.ps1 -Release -SdkRoot "$env:WDK_CONTENT_ROOT" -WdkRoot "$env:WDK_CONTENT_ROOT"
          Pop-Location

      - name: Upload driver Release binary
        uses: actions/upload-artifact@v4
        with:
          name: opensysmon-driver-release
          path: SysmonDrv/x64/Release/SysmonDrv.sys
          if-no-files-found: error

  package-release:
    name: Package OpenSysmon Release
    needs: [build-user, build-driver]
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download user-mode binary
        uses: actions/download-artifact@v4
        with:
          name: opensysmon-user-release
          path: release-input/user

      - name: Download driver binary
        uses: actions/download-artifact@v4
        with:
          name: opensysmon-driver-release
          path: release-input/driver

      - name: Create Release ZIP
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $version = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { "manual-${{ github.run_number }}" }
          pwsh -File ./scripts/New-ReleasePackage.ps1 `
            -Version $version `
            -OutputDirectory ./dist `
            -UserBinaryPath ./release-input/user/Sysmon.exe `
            -DriverBinaryPath ./release-input/driver/SysmonDrv.sys

      - name: Upload Release package artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenSysmon-release-package
          path: dist/OpenSysmon-*.zip
          if-no-files-found: error

      - name: Publish GitHub Release when a tag is supplied
        if: ${{ inputs.release_tag != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $zip = Get-ChildItem ./dist/OpenSysmon-*.zip | Select-Object -First 1
          gh release create $env:RELEASE_TAG $zip.FullName --title "OpenSysmon $env:RELEASE_TAG" --generate-notes --target $env:GITHUB_SHA
